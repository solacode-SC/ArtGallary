version: '3.8'

services:
  app:
    container_name: vibegallery-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5080:5080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5080
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  frontend-net:
    name: vibegallery-dev-net
    driver: bridge
