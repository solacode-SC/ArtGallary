<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore all creations in VibeGallery. Filter, search, and browse the full catalog of premium designs.">
    <title>Creations — VibeGallery Design Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">
    <!-- Ambient Background Orbs -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Gallery Layout Container -->
    <div class="app-layout">
        <!-- Sidebar Navigation (Left) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="back-home-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Museum</span>
                </a>
                <div class="logo">
                    <span class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                            <rect width="32" height="32" rx="8" fill="url(#sidebar-logo-gradient)"/>
                            <path d="M10 22V10L16 16L22 10V22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="sidebar-logo-gradient" x1="0" y1="0" x2="32" y2="32">
                                    <stop stop-color="#8CAE68"/>
                                    <stop offset="1" stop-color="#C47C69"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </span>
                    <span class="logo-text">VibeGallery</span>
                </div>
            </div>

            <!-- Search Wrapper -->
            <div class="sidebar-search">
                <label class="sidebar-label">Search Library</label>
                <div class="search-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Find design...">
                </div>
            </div>

            <!-- Vertical Filters -->
            <div class="sidebar-filters">
                <label class="sidebar-label">Categories</label>
                <div class="vertical-tabs">
                    <button class="vertical-tab active" data-filter="all">
                        <span class="tab-emoji">📦</span>
                        <span class="tab-text">All Designs</span>
                    </button>
                    <button class="vertical-tab" data-filter="dashboard">
                        <span class="tab-emoji">📊</span>
                        <span class="tab-text">Dashboards</span>
                    </button>
                    <button class="vertical-tab" data-filter="landing">
                        <span class="tab-emoji">🎨</span>
                        <span class="tab-text">Landing Pages</span>
                    </button>
                    <button class="vertical-tab" data-filter="ecommerce">
                        <span class="tab-emoji">🛍️</span>
                        <span class="tab-text">E-Commerce</span>
                    </button>
                    <button class="vertical-tab" data-filter="app">
                        <span class="tab-emoji">💬</span>
                        <span class="tab-text">Web Apps</span>
                    </button>
                </div>
            </div>

            <!-- Quick Stats in Sidebar -->
            <div class="sidebar-stats">
                <label class="sidebar-label">Museum Stats</label>
                <div class="mini-stat-card">
                    <div class="mini-stat">
                        <span class="mini-stat-val">6</span>
                        <span class="mini-stat-lbl">Creations</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-stat-val">4</span>
                        <span class="mini-stat-lbl">Mediums</span>
                    </div>
                </div>
            </div>

            </div>
        </aside>

        <!-- Main Gallery Canvas (Right) -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <h1 class="page-title">Creations Catalog</h1>
                    <p class="page-description">Browse and discover all design works within the museum.</p>
                </div>
                <div class="header-right">
                    <span class="result-count" id="result-count">Showing 6 designs</span>
                    <div class="view-toggles">
                        <button class="view-btn active" data-view="grid" id="view-grid" aria-label="Grid view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                            </svg>
                        </button>
                        <button class="view-btn" data-view="list" id="view-list" aria-label="List view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Card Grid -->
            <div class="gallery-grid" id="gallery-grid">
                <!-- Injected dynamically by JS -->
            </div>

            <!-- Empty State -->
            <div class="empty-state hidden" id="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                    <path d="M8 11h6"/>
                </svg>
                <h3>No creations found</h3>
                <p>Try clearing filters or search terms.</p>
            </div>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-overlay hidden" id="lightbox-overlay">
        <div class="lightbox" id="lightbox">
            <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
            <div class="lightbox-image-wrap">
                <img src="" alt="" class="lightbox-image" id="lightbox-image">
            </div>
            <div class="lightbox-info">
                <h3 class="lightbox-title" id="lightbox-title"></h3>
                <p class="lightbox-desc" id="lightbox-desc"></p>
                <div class="lightbox-meta">
                    <span class="lightbox-category" id="lightbox-category"></span>
                    <span class="lightbox-tags" id="lightbox-tags"></span>
                </div>
                <a href="#" target="_blank" rel="noopener noreferrer" class="lightbox-open-btn" id="lightbox-open-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                        <polyline points="15 3 21 3 21 9"/>
                        <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    Open in New Tab
                </a>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
