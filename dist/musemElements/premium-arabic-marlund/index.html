<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مخطط حجوزات مطعم مأكولات ومشروبات مارلوند الفاخر. احجز طاولتك الخاصة الآن بسهولة ويسر.">
    <title>مَارْلُونْد | حجوزات الطاولات والفعاليات</title>
    
    <!-- Google Fonts: Cairo for bold logos/headings and Alexandria for dashboard forms -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="marlund-split-wrapper">
        
        <!-- ==========================================================================
             RIGHT COLUMN (RTL): Visual Cocktail Banner Panel
             ========================================================================== -->
        <section class="split-col visual-column-panel">
            
            <!-- Logo branding on top -->
            <div class="logo-overlay-wrap">
                <span class="marlund-logo">MARLUND®</span>
            </div>

            <!-- Glowing Abstract Orbs simulating Cocktails and Orange slices -->
            <div class="cocktail-orb-mesh"></div>
            <div class="orange-slice-mesh"></div>
            <div class="glass-rim-reflection"></div>

            <!-- Massive bold heading on bottom -->
            <div class="title-overlay-wrap">
                <h1 class="split-massive-title">الحجوزات</h1>
            </div>

        </section>

        <!-- ==========================================================================
             LEFT COLUMN (RTL): Sand-Beige Form Panel
             ========================================================================== -->
        <section class="split-col form-column-panel">
            
            <!-- Navigation Menu Row (RTL Mirrored) -->
            <nav class="form-nav-menu" aria-label="قائمة حجز الطاولات">
                <a href="#" class="nav-item">القائمة</a>
                <a href="#" class="nav-item">من نحن</a>
                <a href="#" class="nav-item">الفعاليات</a>
                <a href="#" class="nav-item">الموقع</a>
                <a href="#" class="nav-item active">الحجز</a>
            </nav>

            <!-- Booking Input Form Container -->
            <div class="booking-form-box">
                
                <div class="form-welcome-header">
                    <h2 class="form-main-title">مرحباً بك في مارلوند</h2>
                    <p class="form-subtitle-desc">نصنع لك تجربة عشاء فاخرة ومميزة. يرجى ملء تفاصيل حجز طاولتك المفضلة.</p>
                </div>

                <form id="marlund-booking-form" class="booking-form">
                    
                    <!-- 1. Name input -->
                    <div class="form-group-field">
                        <label for="book-name-input">الاسم الكامل</label>
                        <div class="input-card-wrap">
                            <span class="field-icon">👤</span>
                            <input type="text" id="book-name-input" required placeholder="أحمد سليمان">
                        </div>
                    </div>

                    <!-- 2. Phone input -->
                    <div class="form-group-field">
                        <label for="book-phone-input">رقم الجوال</label>
                        <div class="input-card-wrap">
                            <span class="field-icon">📞</span>
                            <input type="tel" id="book-phone-input" required placeholder="966500000000+">
                        </div>
                    </div>

                    <!-- 3. Guests count picker -->
                    <div class="form-group-field">
                        <label for="book-guests-picker">عدد الضيوف</label>
                        <div class="input-card-wrap select-wrapper">
                            <span class="field-icon">👥</span>
                            <select id="book-guests-picker" required>
                                <option value="1">ضيف واحد</option>
                                <option value="2" selected>ضيفان (٢)</option>
                                <option value="3">٣ ضيوف</option>
                                <option value="4">٤ ضيوف</option>
                                <option value="5">٥ ضيوف</option>
                                <option value="6">٦ ضيوف فأكثر</option>
                            </select>
                        </div>
                    </div>

                    <!-- 4. Date picker -->
                    <div class="form-group-field">
                        <label for="book-date-picker">تاريخ الحجز</label>
                        <div class="input-card-wrap">
                            <span class="field-icon">📅</span>
                            <input type="date" id="book-date-picker" required>
                        </div>
                    </div>

                    <!-- 5. Time picker -->
                    <div class="form-group-field">
                        <label for="book-time-picker">وقت الحضور</label>
                        <div class="input-card-wrap">
                            <span class="field-icon">🕒</span>
                            <input type="time" id="book-time-picker" required>
                        </div>
                    </div>

                    <!-- 6. Dark Booking CTA -->
                    <button type="submit" class="btn-submit-booking">تأكيد حجز الطاولة</button>

                    <!-- Consent check line -->
                    <div class="consent-check-row">
                        <input type="checkbox" id="consent-check" required checked>
                        <label for="consent-check">بالنقر على "تأكيد حجز الطاولة"، فإنك توافق على سياسة الخصوصية الخاصة بنا.</label>
                    </div>

                </form>
            </div>

        </section>

    </main>

    <!-- ==========================================================================
         Booking Confirmation Success Modal
         ========================================================================== -->
    <div class="modal-dialog-overlay" id="success-modal" aria-hidden="true" role="dialog">
        <div class="modal-card">
            <button class="modal-close-btn" id="btn-close-modal" aria-label="إغلاق">×</button>
            <div class="success-icon-badge">✨</div>
            <h3 class="modal-title">تم استلام طلب حجزك بنجاح</h3>
            <p class="modal-subtitle" id="success-message-text">شكرًا لك! سيتم تأكيد طاولة ضيفين باسم أحمد سليمان في أقرب وقت.</p>
            <button class="btn-modal-ok" id="btn-modal-ok">حسناً</button>
        </div>
    </div>

    <!-- Script validations -->
    <script src="app.js"></script>
</body>
</html>
